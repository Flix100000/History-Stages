apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client {
            property "historystages.demoCategory", "true"
            // NeoForge's load-warnings screen only shows in dev, but it sits in front of quick play.
            // Both triggers are other mods: Lootr's bundled Resourceful Config still uses logoFile,
            // Spell Engine uses @OnlyIn. Their log lines stay.
            property "neoforge.warnings.logofile.hide", "true"
            property "neoforge.warnings.onlyin.hide", "true"
        }
        server {
            programArg "--nogui"
            // Own directory, so a dedicated server and a client can run side by side.
            runDir "run-server"
            property "historystages.demoCategory", "true"
        }
        // Runs every registered GameTest and exits.
        gameTestServer {
            server()
            forgeTemplate "gameTestServer"
            name "GameTest Server"
            runDir "run-gametest"
            property "neoforge.enabledGameTestNamespaces", rootProject.mod_id
            property "historystages.demoCategory", "true"
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    implementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    // The only hard dependency besides Architectury, see neoforge.mods.toml.
    implementation "maven.modrinth:lootr:${rootProject.lootr_neoforge_modrinth_id}"

    // ---- Optional integrations ----
    // In the dev runs too, unless -Pbare (smoke.sh --bare) asks for a run without them.
    compileOnly "maven.modrinth:jade:${rootProject.jade_neoforge_version}"
    compileOnly "mezz.jei:jei-26.2-neoforge-api:${rootProject.jei_version}"
    compileOnly "maven.modrinth:curios:${rootProject.curios_version}"
    compileOnly "maven.modrinth:spell-engine:${rootProject.spell_engine_neoforge_version}"
    if (!rootProject.hasProperty("bare")) {
        localRuntime "maven.modrinth:jade:${rootProject.jade_neoforge_version}"
        localRuntime "mezz.jei:jei-26.2-neoforge:${rootProject.jei_version}"
        localRuntime "maven.modrinth:better-combat:${rootProject.better_combat_neoforge_version}"
        localRuntime "maven.modrinth:reliable-remover:${rootProject.reliable_remover_neoforge_version}"
        localRuntime "maven.modrinth:reliable-recipes:${rootProject.reliable_recipes_neoforge_version}"
        localRuntime "maven.modrinth:spell-engine:${rootProject.spell_engine_neoforge_version}"
        localRuntime "maven.modrinth:spell-power:${rootProject.spell_power_neoforge_version}"
        localRuntime "maven.modrinth:player-animation-library:${rootProject.player_animation_lib_version}"
        localRuntime "maven.modrinth:cloth-config:${rootProject.cloth_config_neoforge_version}"
        localRuntime "maven.modrinth:curios:${rootProject.curios_version}"
    }

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

tasks.named("test", Test) {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

processResources {
    var replaceProperties = [
            version               : project.version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neoforge_version_range: rootProject.neoforge_version_range,
            mod_id                : rootProject.mod_id,
            mod_name              : rootProject.mod_name,
            mod_license           : rootProject.mod_license,
            mod_authors           : rootProject.mod_authors,
            mod_description       : rootProject.mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    // The jar ships the root license rather than a copy under resources, which once went stale.
    from rootProject.file("LICENSE.txt")
}

assemble.dependsOn shadowJar
