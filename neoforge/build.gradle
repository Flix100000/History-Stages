apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client {
            property "historystages.demoCategory", "true"
        }
        server {
            programArg "--nogui"
            // Own directory, so a dedicated server and a client can run side by side.
            runDir "run-server"
            property "historystages.demoCategory", "true"
        }
        // Runs every registered GameTest and exits.
        gameTestServer {
            server()
            forgeTemplate "gameTestServer"
            name "GameTest Server"
            runDir "run-gametest"
            property "neoforge.enabledGameTestNamespaces", rootProject.mod_id
            property "historystages.demoCategory", "true"
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    implementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    // The only hard dependency besides Architectury, see neoforge.mods.toml.
    implementation "maven.modrinth:lootr:${rootProject.lootr_neoforge_modrinth_id}"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    var replaceProperties = [
            version               : project.version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neoforge_version_range: rootProject.neoforge_version_range,
            mod_id                : rootProject.mod_id,
            mod_name              : rootProject.mod_name,
            mod_license           : rootProject.mod_license,
            mod_authors           : rootProject.mod_authors,
            mod_description       : rootProject.mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    // The jar ships the root license rather than a copy under resources, which once went stale.
    from rootProject.file("LICENSE.txt")
}

assemble.dependsOn shadowJar
