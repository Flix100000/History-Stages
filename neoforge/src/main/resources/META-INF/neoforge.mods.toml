modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/Flix100000/History-Stages/issues"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
displayURL="https://historystages.github.io/"
iconFile="assets/${mod_id}/icon.png"
iconBlur=false

[[mixins]]
config="historystages.mixins.json"

[[mixins]]
config="historystages-neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
type="required"
# 21.1.12 is what we compile against; the 21.1.x line is the one for 26.2.
versionRange="[21.1.12,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lootr"
type="required"
# 1.23.38.112 is the first Lootr for 26.2 and already has the filter API in api.interfaces.filter.
versionRange="[1.23.38.112,)"
ordering="AFTER"
side="BOTH"

# EMI, FTB Teams/Quests and Accessories come back once they have 26.2 builds.
[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[30,31)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[26.2,26.3)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[16,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="spell_engine"
type="optional"
versionRange="[1.9,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="bettercombat"
type="optional"
versionRange="[1,)"
ordering="AFTER"
side="BOTH"
