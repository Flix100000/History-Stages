architectury {
    common(rootProject.platforms.split(","))
}

dependencies {
    // Architectury's common API exposes Fabric Loader types (EnvType); nothing else from Fabric
    // Loader belongs in common. No @Environment either: it becomes @OnlyIn on NeoForge, and
    // NeoForge 26.2 reports every such class as a load warning.
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "dev.architectury:architectury:${rootProject.architectury_api_version}"
    // ModConfigSpec is built on NightConfig. NeoForge ships 3.9.0 itself; the Fabric jar has to
    // bundle the same version. compileOnly, so common never decides what ships.
    compileOnly "com.electronwill.night-config:core:3.9.0"
    compileOnly "com.electronwill.night-config:toml:3.9.0"

    // Lootr's filter API lives in its loader-neutral package; the Fabric jar is only the
    // carrier here, the platforms put their own Lootr on the classpath.
    compileOnly "maven.modrinth:lootr:${rootProject.lootr_fabric_modrinth_id}"

    // Optional integrations. Their APIs are loader-neutral, the Fabric jars only carry them.
    compileOnly "maven.modrinth:jade:${rootProject.jade_fabric_version}"
    compileOnly "mezz.jei:jei-26.2-common-api:${rootProject.jei_version}"
    compileOnly "maven.modrinth:spell-engine:${rootProject.spell_engine_fabric_version}"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.electronwill.night-config:core:3.9.0"
    testImplementation "com.electronwill.night-config:toml:3.9.0"
}

tasks.named("test", Test) {
    useJUnitPlatform()
    // The lock benchmark is an instrument, not a test: on only with `./gradlew test -Pbench`.
    systemProperty "historystages.bench", project.hasProperty("bench") ? "true" : "false"
    testLogging {
        events "passed", "skipped", "failed"
    }
}
