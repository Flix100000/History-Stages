#Stage Graph — the progression map players open from the pause screen and
#admins open from the in-game editor.
#The [visibility] section affects ONLY the player view; the editor view always
#shows everything. Everything else applies to both.
[general]
	# Start with the legend expanded? [Default: false]
	legendOpen = false
	# Show the searchable stage list on the left? [Default: true]
	showSidebar = true
	# Start with the sidebar expanded rather than collapsed to its rail? [Default: true]
	sidebarOpen = true
	# Show the legend? [Default: true]
	showLegend = true
	# Screen title. Either literal text or a translation key.
	# Literal text may carry & colour codes, e.g. &6Progression.
	title = "graph.historystages.title"
	# Show the 'Stage Graph' button in the pause screen for players?
	# Off by default: the graph reveals how the pack is structured, so a pack
	# author should switch it on deliberately rather than find it already there.
	# Turning it off only removes the player button — admins can always reach the
	# graph through the in-game editor or with '/history graph'. [Default: false]
	enabled = true
#Canvas behaviour and background.
[canvas]
	# Base colour of the canvas, #RRGGBB. Shows under the grid, on its own
	# for SOLID, and wherever a texture is missing. [Default: #17171A]
	backgroundColor = "#17171A"
	# Pixels per grid cell at zoom 1.0.
	gridSize = 48
	#Range: 1.0 ~ 8.0
	maxZoom = 2.5
	# GRID, SOLID or TEXTURE.
	background = "TEXTURE"
	# Play hover, open and drop animations? [Default: true]
	animations = true
	# Texture tiled behind the graph when background = TEXTURE.
	# A full texture path, e.g. minecraft:textures/block/polished_andesite.png.
	# Blank, unparseable or missing falls back to the plain colour, so a typo
	# leaves a readable canvas rather than a missing-texture chequerboard.
	backgroundTexture = "minecraft:textures/block/andesite.png"
	#Range: 0.05 ~ 1.0
	minZoom = 0.3
	#Range: 0.1 ~ 4.0
	startZoom = 1.0
	# Player view only: fit the viewport to the visible nodes on open.
	# Keep this on — filtered-out stages leave gaps in the map, and without
	# fitting a fresh world opens on empty space. [Default: true]
	fitOnOpen = true
#How much of the map the PLAYER view reveals. The editor ignores this.
[visibility]
	# ALL                = every stage, including standalone ones.
	# PROGRESSIVE        = unlocked stages plus their direct neighbours, and everything currently researchable.
	# PROGRESSIVE_STRICT = the same, minus the researchable stages that hang off nothing the player owns
	#                      (free-standing roots, and stages that only ask for items or XP).
	# UNLOCKED_ONLY      = only stages the player has already unlocked.
	# A stage removed by this filter takes its edges with it — no placeholder node.
	mode = "ALL"
	# Show individual (per-player) stages in the graph? [Default: true]
	showIndividualStages = true
	# Mask the NAME of stages that carry a 'hidden_display' config?
	# This is not the same as the filter above: such a stage is still drawn and
	# still connected, it just shows as '???'. [Default: true]
	respectHiddenDisplay = true
#Which sections the detail panel on the right shows.
[panel]
	showScoreboard = true
	# Show the per-stage info text from graph_stages.json?
	showDescription = true
	# Show why a blocked stage is blocked ('Blocked while ...')?
	# Under blockedDisplay = PLAIN in visual.toml only the heading shows. [Default: true]
	showBlockedReason = true
	showItems = true
	# Show the 'unlocks' list — what this stage leads to?
	showUnlocks = true
	showKills = true
	showStats = true
	# Show auto-unlock triggers for AUTO/TEMPORARY stages? These reveal the
	# condition that unlocks a stage. [Default: true]
	showTriggers = true
	showAdvancements = true
	showStageDeps = true
	showXp = true
#Dependency lines.
[edges]
	# STRAIGHT, ORTHOGONAL or CURVED.
	routing = "ORTHOGONAL"
	# Line style for an unsatisfied AND dependency.
	# Solid by default so the two visual axes stay separate: the LINE STYLE
	# says AND vs OR, the COLOUR says satisfied vs open. Setting this to
	# DASHED makes an open AND dependency look like an OR one — the graph
	# compensates by drawing OR groups with a finer dotted pattern, but the
	# distinction is much weaker.
	styleOpen = "SOLID"
	#Range: 1 ~ 6
	width = 2
	arrowheads = false
	# Colour of a satisfied dependency, #RRGGBB.
	colorMet = "#00FF00"
	# Colour of an open dependency, #RRGGBB.
	colorOpen = "#FF0000"
	# Line style for dependencies inside an OR group.
	# Dashed by default, against solid AND dependencies — that is the whole
	# signal for 'one of these is enough'.
	orGroupStyle = "DASHED"
	# Line style for a satisfied AND dependency.
	styleMet = "SOLID"
#Node appearance, per lock state and per stage collection.
#A stage may override any of these individually in
#settings/graph_stages.json.
#
#The status badge (checkmark) is on for UNLOCKED and BLOCKED only. A tick
#means 'you have this'; putting one on a reachable stage claims something is
#done when it is merely available next. On a blocked stage the badge is a
#no-entry sign instead, which says why it cannot be researched.
[style]
	[style.individual]
		[style.individual.blocked]
			# Border colour, #RRGGBB.
			border = "#CC4444"
			# Node outline: RECT, ROUNDED, CIRCLE, DIAMOND or HEXAGON.
			shape = "DIAMOND"
			# Scale relative to the base node size.
			size = 1.0
			# Fill opacity, 0.0 = transparent, 1.0 = solid.
			fillOpacity = 0.35
			# Border thickness in pixels.
			borderWidth = 2
			# Draw the status badge on the node? A tick on unlocked stages,
			# a red no-entry sign on stages blocked by their logic.
			checkmark = false
			# Text under the node: NONE, ID or DISPLAY_NAME.
			label = "DISPLAY_NAME"
			# Fill colour, #RRGGBB.
			fill = "#5A1E1E"
			# Label colour, #RRGGBB.
			labelColor = "#DDDDDD"
			# Corner radius in pixels.
			# Currently has NO effect: the ROUNDED shape is drawn from a texture
			# generated once at a fixed relative radius, so the corners cannot
			# change per node. Kept so existing files keep loading.
			cornerRadius = 4
		[style.individual.locked]
			# Border colour, #RRGGBB.
			border = "#555555"
			# Node outline: RECT, ROUNDED, CIRCLE, DIAMOND or HEXAGON.
			shape = "DIAMOND"
