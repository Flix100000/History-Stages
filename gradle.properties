# The daemon is shared by three projects plus Minecraft decompilation, 1G is not enough.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
# Loom and the Architectury plugin do not support the configuration cache.
org.gradle.configuration-cache=false

platforms=fabric,neoforge

minecraft_version=26.2
minecraft_version_range=[26.2,26.3)

## Mod Properties

mod_id=historystages
mod_name=History Stages
mod_license=All Rights Reserved
# Jar version is <mod_version>-<minecraft_version>, see build.gradle.
mod_version=6.1.0
mod_group_id=net.bananemdnsa.historystages
mod_authors=Bananemdnsa, PixlStudios
mod_description=Guide your players through the ages. Lock items, recipes, fluids, villager trades, structures, biomes, dimensions, mobs, loot and more behind custom research-based Stages, unlocked server-wide or individual at the Research Pedestal, or automatically from what a player has already done. Ships with a full in-game editor and an API other mods can hook into.

## Dependencies

architectury_api_version=21.1.12
neoforge_version=26.2.0.93
neoforge_version_range=[26.2,)
fabric_loader_version=0.20.1
fabric_api_version=0.161.0+26.2

# Lootr publishes the same version number for both loaders, so Modrinth Maven needs the version id.
lootr_neoforge_modrinth_id=qsxWCPd3
lootr_fabric_modrinth_id=HegkPUoM

# Optional integrations (Modrinth version numbers). Present in the dev runs unless -Pbare is set.
# JEI has only betas for 26.2.
jei_version=30.48.0.244
jade_neoforge_version=26.2.10+neoforge
jade_fabric_version=26.2.11+fabric
better_combat_neoforge_version=3.2.2+26.2-neoforge
better_combat_fabric_version=3.2.2+26.2-fabric
# Curios exists for NeoForge only.
curios_version=16.0.0+26.2
# Reliable Remover is read by reflection, so it is only in the dev runs; Reliable Recipes is its requirement.
reliable_remover_neoforge_version=3.9.1+26.2-neoforge
reliable_remover_fabric_version=3.9.1+26.2-fabric
reliable_recipes_neoforge_version=3.9.0+26.2-neoforge
reliable_recipes_fabric_version=3.9.0+26.2-fabric
spell_engine_neoforge_version=1.10.9+26.2-neoforge
spell_engine_fabric_version=1.10.9+26.2-fabric
# Spell Engine's own requirements, for the dev runs only.
spell_power_neoforge_version=1.6.2+26.2-neoforge
spell_power_fabric_version=1.6.2+26.2-fabric
# Same version number for 26.2 and 26.3, so the Modrinth version id.
player_animation_lib_version=HehiWi0E
cloth_config_neoforge_version=26.2.155+neoforge
cloth_config_fabric_version=26.2.155+fabric
trinkets_version=4.1.1+26.2
