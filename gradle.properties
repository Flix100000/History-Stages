# The daemon is shared by three projects plus Minecraft decompilation, 1G is not enough.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
# Loom and the Architectury plugin do not support the configuration cache.
org.gradle.configuration-cache=false

platforms=fabric,neoforge

minecraft_version=26.2
minecraft_version_range=[26.2,26.3)

## Mod Properties

mod_id=historystages
mod_name=History Stages
mod_license=All Rights Reserved
# Jar version is <mod_version>-<minecraft_version>, see build.gradle.
mod_version=6.1.0
mod_group_id=net.bananemdnsa.historystages
mod_authors=Bananemdnsa, PixlStudios
mod_description=Guide your players through the ages. Lock items, recipes, fluids, villager trades, structures, biomes, dimensions, mobs, loot and more behind custom research-based Stages, unlocked server-wide or individual at the Research Pedestal, or automatically from what a player has already done. Ships with a full in-game editor, KubeJS and CraftTweaker integration, and an API other mods can hook into.

## Dependencies

architectury_api_version=21.1.12
neoforge_version=26.2.0.93
neoforge_version_range=[26.2,)
fabric_loader_version=0.20.1
fabric_api_version=0.161.0+26.2

# Lootr publishes the same version number for both loaders, so Modrinth Maven needs the version id.
lootr_neoforge_modrinth_id=qsxWCPd3
lootr_fabric_modrinth_id=HegkPUoM
