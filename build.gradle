plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven {
		name = "CurseMaven"
		url = "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases"
	}
}

loom {
	// One source set, so the package layout matches neoforge-1.21.X file for file. Loom no longer
	// enforces the client/server split at compile time; client-only code is kept off the dedicated
	// server by the entrypoints in fabric.mod.json and by FabricLoader environment checks.
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = "historystages.refmap.json"
	}

	mods {
		"historystages" {
			sourceSet sourceSets.main
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	//JADE
	modImplementation "maven.modrinth:jade:15.10.5+fabric"
	//JEI
	modImplementation "maven.modrinth:jei:19.27.0.340"
	//EMI
	modCompileOnly "dev.emi:emi-fabric:1.1.24+1.21.1:api"
	//FTBQuest
	modCompileOnly "curse.maven:ftb-library-fabric-438495:7746958"
	modCompileOnly "curse.maven:ftb-teams-fabric-438497:7878280"
	modCompileOnly "curse.maven:ftb-quests-fabric-438496:7878288"
	//Lootr
	modImplementation "curse.maven:lootr-fabric-615106:8041235"
	// Replaced by the mod's own TOML config layer in R3, see the port plan.
	modImplementation "curse.maven:cloth-config-348521:5729125"

	// ---- Unit tests ----
	// Loader-neutral tests, shared with neoforge-1.21.X. They must never import net.minecraft:
	// Minecraft is not on this source set's test classpath.
	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// The tests work with Gson directly and do not get it from the Minecraft runtime classpath.
	testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('test', Test) {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	inputs.property "mod_id", project.mod_id
	inputs.property "mod_name", project.mod_name
	inputs.property "mod_license", project.mod_license
	inputs.property "mod_authors", project.mod_authors
	inputs.property "mod_description", project.mod_description

	filesMatching("fabric.mod.json") {
		expand(
				"version": inputs.properties.version,
				"mod_id": inputs.properties.mod_id,
				"mod_name": inputs.properties.mod_name,
				"mod_license": inputs.properties.mod_license,
				"mod_authors": inputs.properties.mod_authors,
				"mod_description": inputs.properties.mod_description
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	// The imported neoforge sources carry umlauts in comments and language keys.
	it.options.encoding = 'UTF-8'
	// javac stops reporting after 100 errors, which hides how much of the loader seam is left
	// while the port runs. Drop this line once the tree compiles again.
	it.options.compilerArgs << '-Xmaxerrs' << '100000'
}

java {
	withSourcesJar()

	toolchain.languageVersion = JavaLanguageVersion.of(21)
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
