plugins {
    id "architectury-plugin" version "3.5.170"
    // 26.x ships unobfuscated, so the no-remap Loom variant and no mappings line.
    id "dev.architectury.loom-no-remap" version "1.17.493" apply false
    id "com.gradleup.shadow" version "9.4.3" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    apply plugin: "java-library"
    apply plugin: "architectury-plugin"

    group = rootProject.mod_group_id
    version = "${rootProject.mod_version}-${rootProject.minecraft_version}"

    base {
        archivesName = "${rootProject.mod_id}-${project.name}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    repositories {
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
            content { includeGroup "dev.architectury" }
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases/"
        }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }
}
