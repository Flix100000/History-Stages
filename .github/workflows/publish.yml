name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # A release created from the wrong branch would otherwise publish this branch's jar
      # under the other branch's tag, so nothing runs unless the tag matches this branch.
      - name: Check release tag matches this branch
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^[0-9]+(\.[0-9]+)*-26\.2$'; then
            echo "::error::Release tag '$TAG' does not match this branch (26.2), expected <mod version>-26.2. Nothing was published."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          # Every compat dependency (Jade, Lootr, the FTB mods, Architectury) comes from
          # cursemaven.com, which rate-limits the shared runner IPs — an uncached run asks for
          # all of them and regularly gets HTTP 429 back. A cache hit never asks at all.
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          # One retry: publishing is a one-shot event, so a transient dependency-resolution
          # failure would otherwise mean re-running the release by hand.
          ./gradlew build || { echo "Build failed, retrying once after 60s"; sleep 60; ./gradlew build; }

      # Picks each jar by name and fails unless exactly one matches. The build leaves a -raw jar
      # (before shadowing) next to the real one in each loader's libs folder, and a glob that
      # takes both would upload the unshaded one as a second file.
      - name: Select jars
        id: jars
        run: |
          pick() {
            local found
            found=$(find "$1/build/libs" -maxdepth 1 -name '*.jar' ! -name '*-raw.jar' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar')
            if [ "$(echo "$found" | grep -c .)" -ne 1 ]; then
              echo "Expected exactly one jar in $1/build/libs, found:" >&2
              echo "$found" >&2
              exit 1
            fi
            echo "$found"
          }
          echo "neoforge=$(pick neoforge)" >> "$GITHUB_OUTPUT"
          echo "fabric=$(pick fabric)" >> "$GITHUB_OUTPUT"

      - name: Publish NeoForge jar to CurseForge & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # CurseForge
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # Modrinth
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # Mod-Details
          name: History Stages ${{ github.event.release.tag_name }} NeoForge
          version: ${{ github.event.release.tag_name }}-neoforge
          changelog: ${{ github.event.release.body }}
          game-versions: |
            26.2
          loaders: neoforge
          # Taken from the release rather than fixed here: a release marked as a prerelease on
          # GitHub was still landing on the Release channel on both platforms, so a beta reached
          # everyone who tracks the mod as if it were finished.
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          dependencies: |
            architectury-api(required)
            lootr(required)
            jei(optional)
            jade(optional)
          java: 25
          files: ${{ steps.jars.outputs.neoforge }}

      - name: Publish Fabric jar to CurseForge & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: History Stages ${{ github.event.release.tag_name }} Fabric
          version: ${{ github.event.release.tag_name }}-fabric
          changelog: ${{ github.event.release.body }}
          game-versions: |
            26.2
          loaders: fabric
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          dependencies: |
            fabric-api(required)
            architectury-api(required)
            lootr(required)
            jei(optional)
            jade(optional)
          java: 25
          files: ${{ steps.jars.outputs.fabric }}

      - name: Upload jars to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.jars.outputs.neoforge }}
            ${{ steps.jars.outputs.fabric }}

  # Announce on Discord only after the build + publish succeeded
  notify:
    needs: publish
    uses: ./.github/workflows/discord-notify.yml
    with:
      release_name: ${{ github.event.release.name || github.event.release.tag_name }}
      release_body: ${{ github.event.release.body }}
      release_url: ${{ github.event.release.html_url }}
      published_at: ${{ github.event.release.published_at }}
      ref: ${{ github.event.release.target_commitish }}
    secrets:
      webhook: ${{ secrets.DISCORD_WEBHOOK }}
